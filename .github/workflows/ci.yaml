name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run tests
        run: go test ./...

  build-and-push:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build and push Docker image
        run: |
          docker build -t 192.168.1.172:30500/go-api:${{ github.sha }} -t 192.168.1.172:30500/go-api:latest .
          docker push 192.168.1.172:30500/go-api:${{ github.sha }}
          docker push 192.168.1.172:30500/go-api:latest

      - name: Update gitops manifest
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/Acoolwolf96/go-api-gitops.git
          cd go-api-gitops
          sed -i "s|192.168.1.172:30500/go-api:.*|192.168.1.172:30500/go-api:${{ github.sha }}|" deployment.yaml
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add deployment.yaml
          git commit -m "update image to ${{ github.sha }}"
          git push