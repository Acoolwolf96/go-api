<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxDrive | Premium Auto Dealership</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0a0c10;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Premium gradient background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(20, 25, 35, 1) 0%, rgba(5, 7, 12, 1) 100%);
            z-index: -2;
        }

        .bg-gradient::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.05)"/><circle cx="80" cy="40" r="1.5" fill="rgba(255,255,255,0.05)"/><circle cx="50" cy="80" r="1" fill="rgba(255,255,255,0.05)"/></svg>');
            background-repeat: repeat;
            opacity: 0.5;
        }

        /* Navigation */
        .navbar {
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            background: rgba(10, 12, 16, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .logo i {
            background: none;
            color: #FFD700;
            font-size: 1.6rem;
        }

        .nav-stats {
            display: flex;
            gap: 2rem;
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            backdrop-filter: blur(5px);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .stat-badge i {
            color: #FFD700;
            margin-right: 8px;
        }

        /* Hero Section */
        .hero {
            padding: 4rem 5% 3rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #FFD700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
        }

        .hero p {
            color: #a0a5b0;
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Filter Bar */
        .filter-bar {
            padding: 0 5% 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.7rem 1.5rem;
            border-radius: 40px;
            color: #e0e0e0;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #FFD700;
            color: #0a0c10;
            border-color: #FFD700;
            transform: translateY(-2px);
        }

        /* Cars Grid */
        .cars-grid {
            padding: 2rem 5%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .car-card {
            background: linear-gradient(135deg, rgba(25, 30, 40, 0.9), rgba(15, 18, 25, 0.95));
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .car-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .car-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .car-card:hover .car-image {
            transform: scale(1.05);
        }

        .car-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #FFD700;
            color: #0a0c10;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            z-index: 1;
        }

        .car-info {
            padding: 1.5rem;
        }

        .car-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .car-subtitle {
            color: #FFD700;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .car-specs {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .spec {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .spec i {
            color: #FFD700;
            font-size: 0.7rem;
        }

        .car-price {
            font-size: 1.8rem;
            font-weight: 800;
            color: #FFD700;
            margin: 1rem 0;
        }

        .car-price small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #a0a5b0;
        }

        .view-details {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 0.7rem;
            border-radius: 12px;
            text-align: center;
            color: #FFD700;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .car-card:hover .view-details {
            background: #FFD700;
            color: #0a0c10;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1f2a, #0f1219);
            border-radius: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 215, 0, 0.3);
            position: relative;
        }

        .modal-close {
            position: sticky;
            top: 1rem;
            right: 1rem;
            float: right;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 1;
        }

        .modal-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .modal-info {
            padding: 2rem;
        }

        /* Loading & Error */
        .loading {
            text-align: center;
            padding: 4rem;
            color: #FFD700;
        }

        .loading i {
            font-size: 3rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 4rem;
            color: #ff6b6b;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .cars-grid { grid-template-columns: 1fr; }
            .navbar { flex-direction: column; gap: 1rem; }
            .nav-stats { gap: 1rem; }
            .stat-badge { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="bg-gradient"></div>

<nav class="navbar">
    <div class="logo">
        <i class="fas fa-crown"></i> LuxDrive
    </div>
    <div class="nav-stats" id="navStats">
        <div class="stat-badge"><i class="fas fa-car"></i> <span id="totalCars">0</span> Vehicles</div>
        <div class="stat-badge"><i class="fas fa-chart-line"></i> Avg <span id="avgPrice">$0</span></div>
    </div>
</nav>

<div class="hero">
    <h1>Where Performance Meets Luxury</h1>
    <p>Discover our curated collection of premium automobiles, each representing the pinnacle of automotive engineering.</p>
</div>

<div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All Vehicles</button>
    <button class="filter-btn" data-filter="featured">Featured</button>
    <button class="filter-btn" data-filter="Electric">Electric</button>
    <button class="filter-btn" data-filter="Gasoline">Gasoline</button>
</div>

<div class="cars-grid" id="carsGrid">
    <div class="loading">
        <i class="fas fa-car-side"></i>
        <p>Loading premium inventory...</p>
    </div>
</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <img id="modalImage" class="modal-image" src="" alt="">
        <div class="modal-info">
            <h2 id="modalTitle"></h2>
            <p id="modalDescription"></p>
            <div class="car-specs" id="modalSpecs"></div>
            <div class="car-price" id="modalPrice"></div>
        </div>
    </div>
</div>

<script>
    let currentCars = [];

    async function fetchCars(filter = 'all') {
        try {
            let url = '/cars';
            if (filter === 'featured') {
                url = '/cars?featured=true';
            } else if (filter === 'Electric') {
                url = '/cars?brand=&featured=false';
                const response = await fetch('/cars');
                const allCars = await response.json();
                currentCars = allCars.filter(car => car.fuelType === 'Electric');
                renderCars(currentCars);
                return;
            } else if (filter === 'Gasoline') {
                const response = await fetch('/cars');
                const allCars = await response.json();
                currentCars = allCars.filter(car => car.fuelType === 'Gasoline');
                renderCars(currentCars);
                return;
            }
            
            const response = await fetch(url);
            currentCars = await response.json();
            renderCars(currentCars);
        } catch (error) {
            console.error('Error fetching cars:', error);
            document.getElementById('carsGrid').innerHTML = '<div class="error"><i class="fas fa-exclamation-triangle"></i><p>Failed to load inventory. Please refresh.</p></div>';
        }
    }

    async function fetchStats() {
        try {
            const response = await fetch('/stats');
            const stats = await response.json();
            document.getElementById('totalCars').textContent = stats.totalCars;
            document.getElementById('avgPrice').textContent = '$' + (stats.avgPrice / 1000).toFixed(0) + 'k';
        } catch (error) {
            console.error('Error fetching stats:', error);
        }
    }

    function formatPrice(price) {
        return '$' + price.toLocaleString();
    }

    function renderCars(cars) {
        const grid = document.getElementById('carsGrid');
        if (!cars || cars.length === 0) {
            grid.innerHTML = '<div class="error"><i class="fas fa-car"></i><p>No vehicles found</p></div>';
            return;
        }

        grid.innerHTML = cars.map(car => `
            <div class="car-card" onclick="showCarDetails(${car.id})">
                <div style="position: relative;">
                    <img class="car-image" src="${car.image}" alt="${car.brand} ${car.model}" onerror="this.src='https://via.placeholder.com/400x300?text=Luxury+Car'">
                    ${car.featured ? '<div class="car-badge"><i class="fas fa-star"></i> FEATURED</div>' : ''}
                </div>
                <div class="car-info">
                    <div class="car-title">${car.brand} ${car.model}</div>
                    <div class="car-subtitle">${car.year}</div>
                    <div class="car-specs">
                        <span class="spec"><i class="fas fa-tachometer-alt"></i> ${car.horsepower} HP</span>
                        <span class="spec"><i class="fas fa-gas-pump"></i> ${car.fuelType}</span>
                        <span class="spec"><i class="fas fa-road"></i> ${car.mileage.toLocaleString()} mi</span>
                    </div>
                    <div class="car-price">${formatPrice(car.price)} <small>USD</small></div>
                    <div class="view-details">
                        <i class="fas fa-arrow-right"></i> View Details
                    </div>
                </div>
            </div>
        `).join('');
    }

    async function showCarDetails(id) {
        try {
            const response = await fetch(`/car/${id}`);
            const car = await response.json();
            
            document.getElementById('modalTitle').textContent = `${car.brand} ${car.model} (${car.year})`;
            document.getElementById('modalDescription').textContent = car.description;
            document.getElementById('modalImage').src = car.image;
            document.getElementById('modalPrice').innerHTML = `${formatPrice(car.price)} <small>USD</small>`;
            
            document.getElementById('modalSpecs').innerHTML = `
                <span class="spec"><i class="fas fa-tachometer-alt"></i> ${car.horsepower} HP</span>
                <span class="spec"><i class="fas fa-gas-pump"></i> ${car.fuelType}</span>
                <span class="spec"><i class="fas fa-road"></i> ${car.mileage.toLocaleString()} miles</span>
                <span class="spec"><i class="fas fa-calendar"></i> ${car.year}</span>
            `;
            
            document.getElementById('modal').style.display = 'flex';
        } catch (error) {
            console.error('Error fetching car details:', error);
        }
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    // Close modal on outside click
    window.onclick = function(event) {
        const modal = document.getElementById('modal');
        if (event.target === modal) {
            closeModal();
        }
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filter = btn.dataset.filter;
            fetchCars(filter);
        });
    });

    // Initialize
    fetchCars('all');
    fetchStats();
    
    // Auto-refresh stats every 30 seconds
    setInterval(fetchStats, 30000);
</script>
</body>
</html>
